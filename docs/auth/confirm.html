<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripTalk — Email Confirmed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #0A2620 0%, #0D1F38 50%, #141466 100%);
    color: #F2F0E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container { max-width: 480px; text-align: center; padding: 40px 24px; }
  h1 { font-size: 2rem; margin-bottom: 12px; }
  .icon { font-size: 4rem; margin-bottom: 24px; }
  p { color: #C8C5BC; margin-bottom: 24px; line-height: 1.6; }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #0d9488, #14b8a6);
    color: white;
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
  }
  .btn:hover { opacity: 0.9; }
  .fallback { margin-top: 24px; color: #6B6960; font-size: 0.85rem; }
</style>
<script>
  // Extract tokens from the URL hash and redirect to the app.
  // Supabase puts the type in the fragment as `&type=signup`, `&type=recovery`,
  // `&type=invite`, etc. We branch to the right deep-link path so the app
  // knows whether to set a new password or sign the user in.
  (function() {
    var hash = window.location.hash.substring(1);
    if (hash && hash.indexOf('access_token') !== -1) {
      var params = {};
      hash.split('&').forEach(function(p) {
        var kv = p.split('=');
        if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
      });
      var type = params['type'] || 'signup';
      var path = type === 'recovery' ? 'recover' : 'callback';
      var appUrl = 'triptalk://auth/' + path + '#' + hash;
      window.location.href = appUrl;
      setTimeout(function() {
        var btn = document.getElementById('open-app');
        if (btn) btn.href = appUrl;
        var heading = document.getElementById('heading');
        var sub = document.getElementById('subheading');
        if (type === 'recovery' && heading) {
          heading.textContent = 'Reset Your Password';
          if (sub) sub.textContent = 'Tap below to open TripTalk and choose a new password.';
          var icon = document.getElementById('icon');
          if (icon) icon.textContent = '🔑';
        }
      }, 100);
    }
  })();
</script>
</head>
<body>
<div class="container">
  <div class="icon" id="icon">✅</div>
  <h1 id="heading">Email Confirmed!</h1>
  <p id="subheading">Your TripTalk account is verified. Tap below to open the app and start exploring.</p>
  <a id="open-app" href="triptalk://home" class="btn">Open TripTalk</a>
  <p class="fallback">If the app doesn't open automatically, make sure TripTalk is installed.</p>
</div>
</body>
</html>
